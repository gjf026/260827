<!DOCTYPE html>
<html lang="zh-cmn-Hans">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=0,viewport-fit=cover">
	<meta name="wechat-enable-text-zoom-em" content="true">
	<title>搜索</title>
	<meta name="layoutmode" content="standard">
	<link rel="stylesheet" type="text/css" href="style.css">
	<link rel="stylesheet" type="text/css" href="ui.css">
	<style>
		.search-container {
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 40px 20px;
		}

		.search-input,
		.search-btn {
			width: 86%;
			box-sizing: border-box;
		}
		
		.search-input {
			min-height: 80px;
			padding: 16px 20px;
			font-size: 30px;
			border: 2px solid #ddd;
			border-radius: 12px;
			outline: none;
			transition: border-color 0.3s;
			resize: none;
			line-height: 1.5;
		}

		.search-input:focus {
			border-color: #07c160;
		}

		.search-btn {
			padding: 16px;
			margin-top: 20px;
			font-size: 30px;
			background-color: #07c160;
			color: white;
			border: none;
			border-radius: 12px;
			cursor: pointer;
			transition: background-color 0.3s;
		}

		.search-btn:active {
			background-color: #06ae56;
		}
	</style>
</head>

<body>
	<div class="page">
		<div class="page__bd" style="height: 100%;">
			<div class="weui-tab">
				<div id="panel1" role="tabpanel" aria-labelledby="tab1" class="weui-tab__panel">
					<div class="weui-form">
						<div class="weui-form__text-area">
							<h2 class="weui-form__title">搜 索</h2>
						</div>
						<div class="weui-form__control-area">
							<div class="search-container">
								<textarea id="search_key_word" class="search-input" placeholder="请输入..." rows="2"></textarea>
								<button onclick="search(); return false;" class="search-btn">确 定</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div role="alert" id="warnToast" style="display: none;">
		<div class="weui-mask_transparent"></div>
		<div class="weui-toast">
			<i class="weui-icon-warn weui-icon_toast"></i>
			<p class="weui-toast__content" id="warnToastContent"></p>
		</div>
	</div>

	<div role="alert" id="loadingToast" style="display: none;">
		<div class="weui-mask_transparent"></div>
		<div class="weui-toast">
			<span class="weui-primary-loading weui-icon_toast">
				<span class="weui-primary-loading__dot"></span>
			</span>
			<p class="weui-toast__content">加载中</p>
		</div>
	</div>
	<script src="jquery.js"></script>
	<script src="script.js"></script>
</body>

</html>
